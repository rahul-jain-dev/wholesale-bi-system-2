[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wholesale-bi-system"
version = "1.0.0"
description = "AI-Powered Wholesale BI System - Decision Support for Indian Wholesale Distributors"
readme = "README.md"
authors = [
    { name = "Rahul Jain", email = "rahuljain3851@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "pandas>=2.2.2,<3.0.0",
    "numpy>=1.26.4,<2.0.0",
    "plotly>=5.22.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.1",
    "prophet>=1.1.5",
    "mlflow>=2.13.2",
    "pyarrow>=15.0.2",
    "altair>=5.3.0",
    "pydantic>=2.7.1",
    "requests>=2.32.3",
    "openpyxl>=3.1.2",
    "joblib>=1.4.2",
    "matplotlib>=3.9.0",
    "holidays>=0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
